<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Widget/Widget"/>
<f:section name="main">
    <div class="text-center">
        <img src="{f:uri.resource(path: 'Icons/f7cacheflow.svg', extensionName: 'cacheflow')}"
             class="widget-f7information-logo"
             alt="CacheFlow Logo"
             style="margin-block-end:8px"/>
    </div>
    <div class="widget-cacheflow-text">
        <f:if condition="{statistics}">
            <f:then>
                <div class="widget-table-wrapper" style="margin-block:0">
                    <table class="widget-table table table-striped">
                        <thead>
                            <tr>
                                <th colspan="2"><f:translate key="widget.statistics.title" extensionName="cacheflow"/></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for key="key" as="entry" each="{statistics}">
                                <f:if condition="{key} != pageStatuses">
                                    <tr>
                                        <td><f:translate key="widget.statistics.{key}" extensionName="cacheflow"/></td>
                                        <td>{entry}</td>
                                    </tr>
                                    <f:if condition="{key} == relevantPagesCount && {statistics.pageStatuses}">
                                        <f:for as="status" each="{statistics.pageStatuses}">
                                            <tr>
                                                <td>- <f:translate key="widget.statistics.pageStatus{status.last_flow_status}" extensionName="cacheflow" default="[{status.last_flow_status}]"/></td>
                                                <td>{status.count_status}</td>
                                            </tr>
                                        </f:for>
                                    </f:if>
                                </f:if>
                            </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <f:translate key="widget.statistics.no_data" extensionName="cacheflow"/>
            </f:else>
        </f:if>
    </div>
</f:section>

<f:section name="footer">
</f:section>
</html>
